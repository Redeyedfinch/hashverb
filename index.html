<!doctype html>
<html lang="en">
<head>

  <title>#Hash · Hashverb OS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF3D9">
  <meta name="description" content="Hashverb Operating System — internal collaboration and event operations for the #Hash tech org.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="js/auth.js"></script>

  <script src="js/taskboard.js"></script>

  <script src="js/views.js"></script>

</html>
