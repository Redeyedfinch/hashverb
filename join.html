<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>#Hash · Join the club</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF3D9">
  <meta name="description" content="Apply to join #Hash — pick your team: Events, Tech, PR, Socials, or Editorial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;600;700&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/app.css">
  <style>
    /* page-local only, jn- prefixed */
    .jn-wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
    .jn-brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
    .jn-brand .b { font-family: var(--pixel, 'Press Start 2P', monospace); font-size: 18px; }
    .jn-brand .t { font-family: var(--mono, 'VT323', monospace); font-size: 18px; opacity: .7; }
    .jn-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
    @media (max-width: 460px) { .jn-teams { grid-template-columns: 1fr; } }
    .jn-team { text-align: left; cursor: pointer; padding: 12px; background: var(--panel, #fff);
               border: 2px solid var(--line, #17131f); box-shadow: 3px 3px 0 var(--line, #17131f); }
    .jn-team:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line, #17131f); }
    .jn-team .nm { font-family: var(--display, 'Space Grotesk', sans-serif); font-weight: 700; font-size: 15px; }
    .jn-team .bl { font-size: 12.5px; opacity: .8; margin-top: 4px; line-height: 1.45; }
    .jn-team.on { background: var(--line, #17131f); color: #FFF3D9; }
    .jn-team.on .bl { opacity: .9; }
    .jn-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 460px) { .jn-grid2 { grid-template-columns: 1fr; } }
    .jn-field { margin-top: 12px; }
    .jn-field label { display: block; font-family: var(--mono, 'VT323', monospace); font-size: 15px;
                      letter-spacing: .04em; margin-bottom: 4px; }
    .jn-field input, .jn-field select, .jn-field textarea {
      width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit;
      background: var(--panel, #fff); border: 2px solid var(--line, #17131f); }
    .jn-field textarea { min-height: 84px; resize: vertical; }
    .jn-hp { position: absolute; left: -9999px; top: -9999px; height: 1px; width: 1px; opacity: 0; }
    .jn-errs { margin: 12px 0 0; padding-left: 18px; }
    .jn-errs li { margin: 3px 0; }
    .jn-foot { margin-top: 22px; font-size: 13px; opacity: .8; text-align: center; }
  </style>
</head>
<body>
  <div class="jn-wrap">
    <div class="jn-brand"><span class="b">#HASH</span><span class="t">// join the crew</span></div>

    <div class="card">
      <div class="eyebrow">// recruitment</div>
      <h1 style="margin:6px 0 8px">Join #Hash.</h1>
      <p class="section-sub" style="margin:0">
        We're not recruiting by domain any more — you join the club as a member of a
        <strong>team</strong>. Pick where you want to work; the crew will contact you.
      </p>
    </div>

    <form id="jnForm" class="card" style="margin-top:14px" novalidate>
      <div id="jnBanner"></div>

      <div class="jn-field">
        <label>Pick your team(s) * <span style="font-family:var(--sans,sans-serif);font-size:12px;opacity:0.75;font-weight:normal">(multiple choice — select all that interest you)</span></label>
      </div>
      <div class="jn-teams" id="jnTeams"></div>

      <div class="jn-grid2">
        <div class="jn-field"><label for="jnName">Full name *</label>
          <input id="jnName" autocomplete="name" maxlength="80"></div>
        <div class="jn-field"><label for="jnUsn">USN (optional)</label>
          <input id="jnUsn" autocomplete="off" autocapitalize="characters" maxlength="24" placeholder="e.g. 23BTRCA042"></div>
      </div>
      <div class="jn-grid2">
        <div class="jn-field"><label for="jnEmail">Email *</label>
          <input id="jnEmail" type="email" autocomplete="email" maxlength="120"></div>
        <div class="jn-field"><label for="jnMobile">Mobile *</label>
          <input id="jnMobile" type="tel" autocomplete="tel" maxlength="16" placeholder="10-digit number"></div>
      </div>
      <div class="jn-grid2">
        <div class="jn-field"><label for="jnDegree">Degree *</label>
          <select id="jnDegree"><option value="">Select…</option></select></div>
        <div class="jn-field"><label for="jnCourse">Course / branch *</label>
          <input id="jnCourse" maxlength="60" placeholder="e.g. Computer Science"></div>
      </div>
      <div class="jn-grid2">
        <div class="jn-field"><label for="jnSem">Semester *</label>
          <select id="jnSem"><option value="">Select…</option></select></div>
        <div class="jn-field"><label for="jnSection">Section (optional)</label>
          <input id="jnSection" maxlength="24" placeholder="e.g. A"></div>
      </div>
      <div class="jn-field">
        <label>Interests (optional)</label>
        <div class="jn-teams" id="jnInterests" style="grid-template-columns:1fr 1fr 1fr"></div>
      </div>
      <div class="jn-field">
        <label for="jnWhy">Why this team? (optional)</label>
        <textarea id="jnWhy" maxlength="600" placeholder="One or two lines is plenty."></textarea>
      </div>

      <!-- honeypot: humans never see or fill this -->
      <input class="jn-hp" id="jnWebsite" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="jn-field">
        <button class="btn primary block" id="jnSubmit" type="submit">Apply to join</button>
      </div>
    </form>

    <div id="jnDone" class="card hidden" style="margin-top:14px"></div>

    <div class="jn-foot">Already a member? <a href="./">Sign in to the #Hash OS</a></div>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    /* Fallback team list — keep in sync with JA_TEAMS in the backend's Join.js.
       The live list from join.info wins whenever the server is reachable. */
    var TEAMS = [
      { key: 'events',    name: 'Events',
        blurb: 'Plan and run everything we host — logistics, venues, schedules and the on-ground crew on event day.' },
      { key: 'tech',      name: 'Tech',
        blurb: 'Build the projects, workshops and tools — AI, robotics, cybersecurity, web. The maker core of the club.' },
      { key: 'pr',        name: 'PR',
        blurb: 'The club\'s voice — outreach, sponsors, speaker invites and collabs with other clubs and colleges.' },
      { key: 'socials',   name: 'Socials',
        blurb: 'Content and community — Instagram and LinkedIn, posters, reels, photos and the memes.' },
      { key: 'editorial', name: 'Editorial',
        blurb: 'Focus on report writing and editing — newsletters, event reports, documentation and publishing.' }
    ];
    var pickedTeams = [];
    var closed = false;
    var DEGREES = ['B.Sc', 'M.Sc'];
    var INTERESTS = ['AI / ML', 'Robotics', 'Cybersecurity', 'Web / App Dev', 'Design',
                     'Content / Media', 'Electronics', 'Competitive Coding', 'Event Ops'];
    var interestsOn = {};

    function $(id) { return document.getElementById(id); }

    function post(api, payload) {
      return fetch(HV_CONFIG.EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        credentials: 'omit',
        body: JSON.stringify({ api: api, args: [payload || {}] }),
        redirect: 'follow'
      }).then(function (r) { return r.json(); })
        .catch(function () { return { ok: false, errors: ['Could not reach the server. Check your connection and try again.'] }; });
    }

    function banner(kind, content) {
      var host = $('jnBanner');
      host.innerHTML = '';
      if (!content) return;
      var div = document.createElement('div');
      div.className = 'banner ' + kind;
      if (typeof content === 'string') div.textContent = content;
      else div.appendChild(content);
      host.appendChild(div);
      div.scrollIntoView({ block: 'nearest' });
    }

    function getOrdinal(n) {
      if (n === 1) return '1st';
      if (n === 2) return '2nd';
      if (n === 3) return '3rd';
      return n + 'th';
    }

    function renderTeams() {
      var host = $('jnTeams');
      host.innerHTML = '';
      TEAMS.forEach(function (t) {
        var idx = pickedTeams.indexOf(t.key);
        var isPicked = idx > -1;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'jn-team' + (isPicked ? ' on' : '');
        b.setAttribute('role', 'checkbox');
        b.setAttribute('aria-checked', isPicked ? 'true' : 'false');

        var topRow = document.createElement('div');
        topRow.style.display = 'flex';
        topRow.style.justifyContent = 'space-between';
        topRow.style.alignItems = 'center';
        topRow.style.gap = '6px';

        var nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = t.name;
        topRow.appendChild(nm);

        if (isPicked) {
          var tag = document.createElement('span');
          tag.className = 'small';
          tag.style.fontSize = '11px';
          tag.style.padding = '2px 6px';
          tag.style.border = '1px solid currentColor';
          tag.style.fontFamily = "var(--mono, 'VT323', monospace)";
          tag.textContent = (pickedTeams.length > 1) ? (getOrdinal(idx + 1) + ' choice') : 'Selected';
          topRow.appendChild(tag);
        }

        var bl = document.createElement('div');
        bl.className = 'bl';
        bl.textContent = t.blurb;

        b.appendChild(topRow);
        b.appendChild(bl);
        b.addEventListener('click', function () {
          var i = pickedTeams.indexOf(t.key);
          if (i > -1) {
            pickedTeams.splice(i, 1);
          } else {
            pickedTeams.push(t.key);
          }
          renderTeams();
        });
        host.appendChild(b);
      });
    }

    function renderSem() {
      var sel = $('jnSem');
      for (var i = 1; i <= 8; i++) {
        var o = document.createElement('option');
        o.value = String(i); o.textContent = 'Semester ' + i;
        sel.appendChild(o);
      }
    }

    function renderDegrees() {
      var sel = $('jnDegree');
      sel.innerHTML = '<option value="">Select degree…</option>';
      DEGREES.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d; o.textContent = d;
        sel.appendChild(o);
      });
    }

    function renderInterests() {
      var host = $('jnInterests');
      host.innerHTML = '';
      INTERESTS.forEach(function (it) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'jn-team' + (interestsOn[it] ? ' on' : '');
        b.style.padding = '9px 10px';
        b.setAttribute('aria-pressed', interestsOn[it] ? 'true' : 'false');
        var nm = document.createElement('div'); nm.className = 'nm'; nm.style.fontSize = '13px'; nm.textContent = it;
        b.appendChild(nm);
        b.addEventListener('click', function () {
          if (interestsOn[it]) delete interestsOn[it]; else interestsOn[it] = true;
          renderInterests();
        });
        host.appendChild(b);
      });
    }
    function pickedInterests() { return Object.keys(interestsOn); }

    function setClosed() {
      closed = true;
      banner('warn', 'Applications are closed right now. Watch #Hash for the next intake.');
      $('jnSubmit').disabled = true;
    }

    function submit(ev) {
      ev.preventDefault();
      if (closed) return;
      var errs = [];
      if (!pickedTeams.length) errs.push('Pick at least one team you want to join.');
      if (!$('jnName').value.trim()) errs.push('Tell us your name.');
      if (!$('jnEmail').value.trim()) errs.push('Enter your email address.');
      if (!$('jnMobile').value.trim()) errs.push('Enter your mobile number.');
      if (!$('jnDegree').value) errs.push('Select your degree.');
      if (!$('jnCourse').value.trim()) errs.push('Enter your course or branch.');
      if (!$('jnSem').value) errs.push('Pick your semester.');
      if (errs.length) { showErrors(errs); return; }

      var btn = $('jnSubmit');
      btn.disabled = true; btn.textContent = 'Sending…';
      post('hv.join.apply', {
        name: $('jnName').value, usn: $('jnUsn').value, email: $('jnEmail').value,
        mobile: $('jnMobile').value, degree: $('jnDegree').value, course: $('jnCourse').value,
        semester: $('jnSem').value, section: $('jnSection').value, interests: pickedInterests(),
        teams: pickedTeams.slice(),
        team: pickedTeams[0] || '',
        team2: pickedTeams.length > 1 ? pickedTeams.slice(1).join(', ') : '',
        why: $('jnWhy').value,
        website: $('jnWebsite').value
      }).then(function (r) {
        btn.disabled = false; btn.textContent = 'Apply to join';
        if (r && r.ok) return done(r.updated === true);
        showErrors((r && r.errors) || ['Something went wrong. Please try again.']);
      });
    }

    function showErrors(errs) {
      var ul = document.createElement('ul');
      ul.className = 'jn-errs';
      errs.forEach(function (e) {
        var li = document.createElement('li'); li.textContent = e; ul.appendChild(li);
      });
      var wrap = document.createElement('div');
      var strong = document.createElement('strong'); strong.textContent = 'Almost there:';
      wrap.appendChild(strong); wrap.appendChild(ul);
      banner('bad', wrap);
    }

    function teamName(key) {
      for (var i = 0; i < TEAMS.length; i++) if (TEAMS[i].key === key) return TEAMS[i].name;
      return key;
    }

    function done(updated) {
      $('jnForm').classList.add('hidden');
      var card = $('jnDone');
      card.classList.remove('hidden');
      card.innerHTML = '';
      var eb = document.createElement('div'); eb.className = 'eyebrow';
      eb.textContent = updated ? '// application updated' : '// application received';
      var h = document.createElement('h2');
      var tNames = pickedTeams.map(teamName).join(' & ');
      h.textContent = (updated ? 'Updated — you\'re down for ' : 'You\'re in the queue for ') + (tNames || 'the club') + '.';
      var p = document.createElement('p'); p.className = 'section-sub';
      p.textContent = 'The crew will reach you on the number and email you gave, usually within a few days. Applying again with the same USN or email just updates this application.';
      card.appendChild(eb); card.appendChild(h); card.appendChild(p);
      window.scrollTo(0, 0);
    }

    /* boot */
    renderTeams(); renderSem(); renderDegrees(); renderInterests();
    $('jnForm').addEventListener('submit', submit);
    post('hv.join.info', {}).then(function (r) {
      if (r && r.ok && r.teams && r.teams.length) { TEAMS = r.teams; renderTeams(); }
      if (r && r.ok && r.closed) setClosed();
    });
  })();
  </script>
</body>
</html>
