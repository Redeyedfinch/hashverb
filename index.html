<!doctype html>

<style>

  h1{font-size:34px;margin:0 0 6px}
  .tag{font-family:ui-monospace,monospace;color:#524b5c}
  .soon{margin-top:20px;border:2px solid var(--line);box-shadow:5px 5px 0 var(--line);

<body>
  <div class="c">
    <h1>#Hash</h1>
